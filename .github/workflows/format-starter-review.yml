name: Format starter review

on:
  push:
    branches: [portfolio-starter]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: portfolio-starter
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format production preflight
        run: pnpm exec prettier --write scripts/check-production.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production.mjs
          git commit -m "style: apply project prettier to production preflight"
          git push origin HEAD:portfolio-starter
